services:
  # ========================================================
  # PostgreSQL 16 Database Container
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: bharatmarket_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-olx_marketplace}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-olx_marketplace}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bharatmarket_net

  # ========================================================
  # Redis 7 In-Memory Cache & Session Store
  # ========================================================
  redis:
    image: redis:7-alpine
    container_name: bharatmarket_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bharatmarket_net

  # MinIO S3-Compatible Object Storage
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: bharatmarket_minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin_olx}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-SuperSecurePassword123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - bharatmarket_net

  # Backend API Server (Fastify + Prisma + Socket.IO + Redis)
  # ========================================================
  server:
    build:
      context: .
      dockerfile: ./infrastructure/docker/Dockerfile.server
    container_name: bharatmarket_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-olx_marketplace}?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-bharatmarket_super_secure_jwt_access_secret_key_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-bharatmarket_super_secure_jwt_refresh_secret_key_2026}
      SMS_PROVIDER: ${SMS_PROVIDER:-MOCK}
      MOCK_OTP_CODE: ${MOCK_OTP_CODE:-123456}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      bharatmarket_net:
        aliases:
          - backend

  # ========================================================
  # BullMQ Background Worker Service
  # ========================================================
  workers:
    build:
      context: .
      dockerfile: ./infrastructure/docker/Dockerfile.worker
    container_name: bharatmarket_workers
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-olx_marketplace}?schema=public"
      REDIS_URL: "redis://redis:6379"
      UPLOAD_DIR: "/app/uploads"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - bharatmarket_net

  # ========================================================
  # Frontend Web Client (React + Vite PWA + Nginx)
  # ========================================================
  client:
    build:
      context: .
      dockerfile: ./infrastructure/docker/Dockerfile.client
    container_name: bharatmarket_client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${CLIENT_PORT:-5173}:80"
    networks:
      - bharatmarket_net

  # ========================================================
  # Admin Operations Client (React + Vite + Nginx)
  # ========================================================
  admin:
    build:
      context: .
      dockerfile: ./infrastructure/docker/Dockerfile.admin
    container_name: bharatmarket_admin
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5174:80"
    networks:
      - bharatmarket_net

  # ========================================================
  # Centralized Nginx Gateway & Reverse Proxy
  # ========================================================
  nginx:
    build:
      context: .
      dockerfile: ./infrastructure/docker/Dockerfile.nginx
    container_name: bharatmarket_nginx
    restart: unless-stopped
    depends_on:
      - server
      - client
      - admin
    ports:
      - "80:80"
    networks:
      - bharatmarket_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  bharatmarket_net:
    driver: bridge
