<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#002f34" />
    <meta name="description" content="BLX Orbit — India's trusted peer-to-peer classifieds platform to buy and sell cars, mobiles, real estate, and electronics." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <title>BLX Orbit — Buy & Sell Anything in India (Cars, Mobiles, Properties)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-gray-100 text-primary font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        const isDev = window.location.hostname === 'localhost' ||
                      window.location.hostname === '127.0.0.1' ||
                      window.location.hostname.includes('github.dev') ||
                      window.location.hostname.includes('app.github.dev') ||
                      window.location.port === '5173' ||
                      window.location.port === '5174';

        if (!isDev) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then((reg) => console.log('[PWA] Service Worker registered:', reg.scope))
              .catch((err) => console.warn('[PWA] Service Worker registration failed:', err));
          });
        } else {
          // In development/Codespaces, unregister any existing service workers to ensure Vite works cleanly
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister();
            }
          });
        }
      }
    </script>
  </body>
</html>
