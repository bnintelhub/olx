map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream backend_service {
    server server:5000;
    keepalive 64;
}

upstream client_service {
    server client:80;
}

upstream media_service {
    server media-service:5005;
    keepalive 32;
}

upstream admin_service {
    server admin:80;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    client_max_body_size 25M;

    # Liveness & Readiness probe
    location = /health {
        proxy_pass http://backend_service/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Direct Static Media Delivery from persistent filesystem with caching
    location /media/ {
        alias /data/olx-media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin *;

        # Protect sensitive internal storage directories
        location ~* ^/media/(temp|quarantine|trash|failed)/ {
            return 403;
        }

        try_files $uri @media_service_fallback;
    }

    location @media_service_fallback {
        proxy_pass http://media_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media Microservice API (Uploads, asset lifecycle, metrics)
    location /api/v1/media/ {
        proxy_pass http://media_service/;
        client_max_body_size 50M;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Routing
    location /api/ {
        proxy_pass http://backend_service/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads Proxy
    location /uploads/ {
        proxy_pass http://backend_service/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket / Realtime Chat
    location /socket.io {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Admin App
    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        rewrite ^/admin/?(.*)$ /$1 break;
        proxy_pass http://admin_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Client App (SPA)
    location / {
        proxy_pass http://client_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
