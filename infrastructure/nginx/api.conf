# Map HTTP Upgrade header to Connection header for WebSocket proxying
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Upstream cluster targets with persistent keepalive connections
upstream backend_service {
    server server:5000;
    keepalive 64;
}

upstream client_service {
    server client:80;
}

upstream admin_service {
    server admin:80;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # Allow up to 50MB request bodies for high-resolution photo/video uploads
    client_max_body_size 50M;

    # Feature 1: Health Check Probe
    # Route container orchestrator or balancer probes directly to Fastify health API
    location = /health {
        proxy_pass http://backend_service/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Feature 2: High-Performance Static Media Delivery
    # Serves cached WebP/AVIF variants directly from the mounted volume without hitting Node.js
    location /media/ {
        alias /data/olx-media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin *;

        # Block direct access to internal and quarantine folders
        location ~* ^/media/(temp|quarantine|trash|failed)/ {
            return 403;
        }

        try_files $uri =404;
    }

    # Feature 3: Backend Resource Media Upload API
    # Routes listing, chat, and avatar image uploads directly to the main Fastify server for BullMQ processing
    location /api/v1/media/images {
        proxy_pass http://backend_service/api/v1/media/images;
        client_max_body_size 50M;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Feature 4: Media Lifecycle API directly on main server
    location /api/v1/media/ {
        proxy_pass http://backend_service/api/v1/media/;
        client_max_body_size 50M;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Feature 5: REST API Gateway
    # Routes all REST endpoints (/api/v1/auth, /ads, /categories, /locations, /payments, etc.) to Fastify
    location /api/ {
        proxy_pass http://backend_service/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Feature 6: Legacy Uploads Proxy
    # Backward compatibility for existing media URLs using the /uploads/ path
    location /uploads/ {
        proxy_pass http://backend_service/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Feature 7: Real-Time WebSocket Gateway (Socket.IO)
    # Upgrades HTTP connections to full duplex WebSockets for live chat messages and telemetry metrics
    location /socket.io {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Feature 8: Admin Operations Portal
    # Rewrites /admin prefix and proxies to the isolated admin web portal container
    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        rewrite ^/admin/?(.*)$ /$1 break;
        proxy_pass http://admin_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Feature 9: Customer Frontend SPA
    # Serves the public marketplace client application for all unmatched routes
    location / {
        proxy_pass http://client_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
