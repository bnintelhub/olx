# ========================================================
# Nginx Development Gateway Configuration
# Local reverse proxy with WebSocket & Vite HMR support
# ========================================================

# Map HTTP Upgrade header to Connection header for WebSocket & Vite HMR proxying
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream backend_service {
    server server:5000;
    keepalive 32;
}

upstream client_service {
    server client:5173;
}

upstream admin_service {
    server admin:5174;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1 _;

    client_max_body_size 50M;

    # Health Check Endpoint
    location = /health {
        proxy_pass http://backend_service/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Direct Static Media Serving from persistent volume with dynamic Fastify backend fallback
    location /media/ {
        alias /data/olx-media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin *;

        # Protect sensitive internal storage folders
        location ~* ^/media/(temp|quarantine|trash|failed)/ {
            return 403;
        }

        # Fallback to backend Fastify if static file not directly on disk
        error_page 404 = @media_backend;
    }

    location @media_backend {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media API Handled directly by backend Fastify
    location /api/v1/media/ {
        proxy_pass http://backend_service/api/v1/media/;
        client_max_body_size 50M;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main Backend REST API Routing
    location /api/ {
        proxy_pass http://backend_service/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legacy Uploads Proxy
    location /uploads/ {
        proxy_pass http://backend_service/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Real-Time WebSocket Gateway (Socket.IO)
    location /socket.io {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Admin Operations Portal (Vite Dev Server with HMR)
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://admin_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Staff Invite acceptance route - direct to Admin portal
    location /accept-invite {
        return 301 /admin/accept-invite$is_args$args;
    }

    # Customer Frontend SPA (Vite Dev Server with HMR)
    location / {
        proxy_pass http://client_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

