# ========================================================
# Nginx Production Gateway Configuration
# Production HTTPS (443) reverse proxy, HTTP->HTTPS redirect (80),
# media caching, SSE, WebSockets & SPA routing
# ========================================================
resolver 127.0.0.11 valid=5s;

# Map HTTP Upgrade header to Connection header for WebSocket proxying
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream backend_service {
    zone backend_service 64k;
    least_conn;
    server server:5000 resolve;
    keepalive 512;
}

upstream client_service {
    zone client_service 64k;
    server client:80 resolve;
}

upstream admin_service {
    zone admin_service 64k;
    server admin:80 resolve;
}

# ==============================================================================
# Port 80: ACME Challenge + Redirect all HTTP traffic to HTTPS (443)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;
    absolute_redirect off;

    # Let's Encrypt ACME verification challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location = /health {
        proxy_pass http://backend_service/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# Port 443: Production HTTPS Server (TLS 1.2 / 1.3 + HTTP/2)
# Mount real domain SSL certs to /etc/nginx/ssl/fullchain.pem & privkey.pem
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;
    absolute_redirect off;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    auth_basic off;
    client_max_body_size 50M;

    # Health Check Endpoint
    location = /health {
        proxy_pass http://backend_service/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Static Media Delivery with dynamic Fastify fallback
    location = /media/ {
        proxy_pass http://backend_service/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /media/ {
        alias /data/olx-media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin *;

        location ~* ^/media/(temp|quarantine|trash|failed)/ {
            return 403;
        }

        error_page 404 = @media_backend;
    }

    location @media_backend {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Media Uploads API
    location /api/v1/media/ {
        proxy_pass http://backend_service/api/v1/media/;
        client_max_body_size 50M;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # PayU Payment Callbacks
    location ^~ /api/v1/payments/payu/ {
        proxy_pass http://backend_service/api/v1/payments/payu/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Real-time SSE Streams (unbuffered)
    location ~* ^/api/v1/(notifications|admin/events|events)/stream {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/v1/admin/events/ {
        proxy_pass http://backend_service/api/v1/admin/events/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Main Backend REST API
    location /api/ {
        proxy_pass http://backend_service/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Legacy Uploads Proxy
    location /uploads/ {
        proxy_pass http://backend_service/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Real-Time WebSocket Gateway (Socket.IO)
    location /socket.io {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Admin Operations Portal
    location = /admin {
        rewrite ^ / break;
        proxy_pass http://admin_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /admin/ {
        rewrite ^/admin/?(.*)$ /$1 break;
        proxy_pass http://admin_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /accept-invite {
        return 301 /admin/accept-invite$is_args$args;
    }

    # Customer Frontend SPA
    location / {
        proxy_pass http://client_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
