# ========================================================
# Nginx Production Gateway Configuration
# Production reverse proxy, media caching, WebSockets & SPA routing
# ========================================================

# Map HTTP Upgrade header to Connection header for WebSocket proxying
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream backend_service {
    server server:5000;
    keepalive 64;
}

upstream client_service {
    server client:80;
}

upstream admin_service {
    server admin:80;
}

# ========================================================
# Main Production HTTP Server
# ========================================================
server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    client_max_body_size 50M;

    # Let's Encrypt ACME verification challenge path (for Certbot on VPS)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Health Check Endpoint (used by Docker / Load Balancer)
    location = /health {
        proxy_pass http://backend_service/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # High-Performance Static Media Delivery directly from persistent volume
    location /media/ {
        alias /data/olx-media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin *;

        # Protect sensitive internal storage folders
        location ~* ^/media/(temp|quarantine|trash|failed)/ {
            return 403;
        }

        try_files $uri =404;
    }

    # Media Uploads & Lifecycle API directly on main server
    location /api/v1/media/ {
        proxy_pass http://backend_service/api/v1/media/;
        client_max_body_size 50M;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main Backend REST API Gateway
    location /api/ {
        proxy_pass http://backend_service/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Legacy Uploads Proxy
    location /uploads/ {
        proxy_pass http://backend_service/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Real-Time WebSocket Gateway (Socket.IO)
    location /socket.io {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Admin Operations Portal
    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        rewrite ^/admin/?(.*)$ /$1 break;
        proxy_pass http://admin_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Staff Invite acceptance route - direct to Admin portal
    location /accept-invite {
        return 301 /admin/accept-invite$is_args$args;
    }

    # Customer Frontend SPA
    location / {
        proxy_pass http://client_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

