# ========================================================
# Nginx Production Gateway Configuration
# Production reverse proxy, media caching, WebSockets & SPA routing
# ========================================================
resolver 127.0.0.11 valid=5s;

# Map HTTP Upgrade header to Connection header for WebSocket proxying
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream backend_service {
    zone backend_service 64k;
    least_conn;
    server server:5000 resolve;
    keepalive 512;
}

upstream client_service {
    zone client_service 64k;
    server client:80 resolve;
}

upstream admin_service {
    zone admin_service 64k;
    server admin:80 resolve;
}

# ==============================================================================
# Main Production HTTP Server (Port 80)
#
# 🟢 MODE 1 (CURRENT - BEFORE DOMAIN / SSL):
#    Serves HTTP traffic directly (used for local/Codespace testing & Certbot ACME challenge).
#
# 🔒 MODE 2 (AFTER DOMAIN ATTACHED & SSL ENABLED):
#    1. UNCOMMENT line 48: "return 301 https://$host$request_uri;"
#    2. UNCOMMENT the complete "HTTPS Server (Port 443)" block at the bottom of this file.
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name localhost _;
    absolute_redirect off;

    # Disable basic authentication for testing and public access
    auth_basic off;

    client_max_body_size 50M;

    # --------------------------------------------------------------------------
    # 🔒 SSL ACTIVATION SWITCH (OFF BY DEFAULT)
    # Once you attach your real domain and generate certificates, UNCOMMENT the
    # line below to automatically redirect all HTTP visitors to secure HTTPS:
    # --------------------------------------------------------------------------
    # return 301 https://$host$request_uri;

    # Let's Encrypt ACME verification challenge path (Keep open on Port 80 always)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Health Check Endpoint (used by Docker / Load Balancer)
    location = /health {
        proxy_pass http://backend_service/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # High-Performance Static Media Delivery directly from persistent volume with dynamic Fastify backend fallback
    location = /media/ {
        proxy_pass http://backend_service/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /data/olx-media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin *;

        # Protect sensitive internal storage folders
        location ~* ^/media/(temp|quarantine|trash|failed)/ {
            return 403;
        }

        # Fallback to backend Fastify if static file not directly on disk
        error_page 404 = @media_backend;
    }

    location @media_backend {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media Uploads & Lifecycle API directly on main server
    location /api/v1/media/ {
        proxy_pass http://backend_service/api/v1/media/;
        client_max_body_size 50M;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PayU sends URL-encoded POST callbacks and may retry them as GET requests.
    # Keep the request body and provider redirect response intact at the gateway.
    location ^~ /api/v1/payments/payu/ {
        proxy_pass http://backend_service/api/v1/payments/payu/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Main Backend REST API Gateway
    # SSE streams must not be buffered, otherwise updates arrive in batches or disconnect
    location ~* ^/api/v1/(notifications|admin/events|events)/stream {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/v1/admin/events/ {
        proxy_pass http://backend_service/api/v1/admin/events/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend_service/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Legacy Uploads Proxy
    location /uploads/ {
        proxy_pass http://backend_service/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Real-Time WebSocket Gateway (Socket.IO)
    location /socket.io {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Admin Operations Portal
    location = /admin {
        rewrite ^ / break;
        proxy_pass http://admin_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /admin/ {
        rewrite ^/admin/?(.*)$ /$1 break;
        proxy_pass http://admin_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Staff Invite acceptance route - direct to Admin portal
    location /accept-invite {
        return 301 /admin/accept-invite$is_args$args;
    }

    # Customer Frontend SPA
    location / {
        proxy_pass http://client_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

