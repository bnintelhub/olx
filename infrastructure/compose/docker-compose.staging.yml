services:
  postgres:
    image: postgres:16-alpine
    container_name: olx_postgres_staging
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-olx_staging}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-olx_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: olx_redis_staging
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.server
    container_name: olx_server_staging
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: staging
      PORT: 5000
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-olx_staging}?schema=public"
      REDIS_URL: "redis://redis:6379"
      ENABLE_RATE_LIMIT: "true"
    ports:
      - "5000:5000"

  workers:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: olx_workers_staging
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: staging
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-olx_staging}?schema=public"
      REDIS_URL: "redis://redis:6379"

volumes:
  postgres_staging_data:
  redis_staging_data:

