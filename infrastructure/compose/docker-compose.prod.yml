services:
  server_1:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.server
    container_name: olx_server_prod_1
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ENABLE_RATE_LIMIT: "true"
    expose:
      - "5000"

  server_2:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.server
    container_name: olx_server_prod_2
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ENABLE_RATE_LIMIT: "true"
    expose:
      - "5000"

  workers:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: olx_workers_prod
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}

  nginx:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.nginx
    container_name: olx_nginx_prod
    restart: always
    depends_on:
      - server_1
      - server_2
    ports:
      - "80:80"
      - "443:443"

