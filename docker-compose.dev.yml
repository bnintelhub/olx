services:
  # ========================================================
  # PostgreSQL 16 Database Container
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: bharatmarket_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-olx_marketplace}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-olx_marketplace}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bharatmarket_net

  # ========================================================
  # Redis 7 In-Memory Cache & Session Store
  # ========================================================
  redis:
    image: redis:7-alpine
    container_name: bharatmarket_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bharatmarket_net

  # ========================================================
  # MinIO S3-Compatible Object Storage
  # ========================================================
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: bharatmarket_minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin_olx}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-SuperSecurePassword123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - bharatmarket_net

  # ========================================================
  # Backend API Server (Fastify + Auto-Reload with tsx watch)
  # ========================================================
  server:
    build:
      context: .
      dockerfile: ./infrastructure/docker/dev/Dockerfile.server
    container_name: bharatmarket_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-olx_marketplace}?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-bharatmarket_super_secure_jwt_access_secret_key_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-bharatmarket_super_secure_jwt_refresh_secret_key_2026}
      SMS_PROVIDER: ${SMS_PROVIDER:-MOCK}
      MOCK_OTP_CODE: ${MOCK_OTP_CODE:-123456}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      S3_ENDPOINT: "http://minio:9000"
      S3_PUBLIC_URL: "http://localhost:9000/olx-media"
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-admin_olx}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-SuperSecurePassword123}
      S3_BUCKET: "olx-media"
    ports:
      - "5000:5000"
    volumes:
      - ./apps/server/src:/app/apps/server/src
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/database/prisma:/app/packages/database/prisma
      - backend_uploads:/app/uploads
    networks:
      bharatmarket_net:
        aliases:
          - backend

  # ========================================================
  # BullMQ Background Worker Service (tsx watch Auto-Reload)
  # ========================================================
  workers:
    build:
      context: .
      dockerfile: ./infrastructure/docker/dev/Dockerfile.worker
    container_name: bharatmarket_workers
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-olx_marketplace}?schema=public"
      REDIS_URL: "redis://redis:6379"
      UPLOAD_DIR: "/app/uploads"
      S3_ENDPOINT: "http://minio:9000"
      S3_PUBLIC_URL: "http://localhost:9000/olx-media"
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-admin_olx}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-SuperSecurePassword123}
      S3_BUCKET: "olx-media"
    volumes:
      - ./apps/workers/src:/app/apps/workers/src
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/database/prisma:/app/packages/database/prisma
      - backend_uploads:/app/uploads
    networks:
      - bharatmarket_net

  # ========================================================
  # Frontend Web Client (Vite Dev Server + Instant HMR)
  # ========================================================
  client:
    build:
      context: .
      dockerfile: ./infrastructure/docker/dev/Dockerfile.client
    container_name: bharatmarket_client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      - VITE_API_TARGET=http://server:5000
    ports:
      - "5173:5173"
    volumes:
      - ./apps/client/src:/app/apps/client/src
      - ./apps/client/public:/app/apps/client/public
      - ./apps/client/index.html:/app/apps/client/index.html
      - ./apps/client/vite.config.ts:/app/apps/client/vite.config.ts
      - ./packages/shared/src:/app/packages/shared/src
    networks:
      - bharatmarket_net

  # ========================================================
  # Admin Operations Client (Vite Dev Server + Instant HMR)
  # ========================================================
  admin:
    build:
      context: .
      dockerfile: ./infrastructure/docker/dev/Dockerfile.admin
    container_name: bharatmarket_admin
    restart: unless-stopped
    depends_on:
      - server
    environment:
      - VITE_API_TARGET=http://server:5000
    ports:
      - "5174:5174"
    volumes:
      - ./apps/admin/src:/app/apps/admin/src
      - ./apps/admin/public:/app/apps/admin/public
      - ./apps/admin/index.html:/app/apps/admin/index.html
      - ./apps/admin/vite.config.ts:/app/apps/admin/vite.config.ts
      - ./packages/shared/src:/app/packages/shared/src
    networks:
      - bharatmarket_net

  # ========================================================
  # Centralized Nginx Gateway with Full WebSocket / HMR Proxy
  # ========================================================
  nginx:
    build:
      context: .
      dockerfile: ./infrastructure/docker/dev/Dockerfile.nginx
    container_name: bharatmarket_nginx
    restart: unless-stopped
    depends_on:
      - server
      - client
      - admin
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/api.dev.conf:/etc/nginx/conf.d/api.conf:ro
    networks:
      - bharatmarket_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  bharatmarket_net:
    driver: bridge
