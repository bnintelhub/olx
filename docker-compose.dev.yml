services:
  # ========================================================
  # PostgreSQL 16 Database Container
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: bharatmarket_postgres
    restart: unless-stopped
    env_file:
      - ./infrastructure/secrets/database.dev.env
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-olx_marketplace}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bharatmarket_net

  # ========================================================
  # Redis 7 In-Memory Cache & Session Store
  # ========================================================
  redis:
    image: redis:7-alpine
    container_name: bharatmarket_redis
    restart: unless-stopped
    env_file:
      - ./infrastructure/secrets/redis.env
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bharatmarket_net

  # ========================================================
  # Media Microservice (Uploads & Filesystem Management)
  # ========================================================
  media-service:
    build:
      context: .
      dockerfile: ./infrastructure/docker/dev/Dockerfile.media
    container_name: bharatmarket_media_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./infrastructure/.env.dev
      - ./infrastructure/secrets/database.dev.env
      - ./infrastructure/secrets/redis.env
      - ./infrastructure/secrets/media.env
    environment:
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-olx_marketplace}?schema=public"
      REDIS_URL: "redis://redis:6379"
      MEDIA_SERVICE_URL: "http://media-service:5005"
    ports:
      - "5005:5005"
    volumes:
      - ./apps/media-service/src:/app/apps/media-service/src
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/shared/dist:/app/packages/shared/dist
      - ./packages/database/prisma:/app/packages/database/prisma
      - ./data/olx-media:/data/olx-media
    networks:
      bharatmarket_net:
        aliases:
          - media-service

  # ========================================================
  # Backend API Server (Fastify + Auto-Reload with tsx watch)
  # ========================================================
  server:
    build:
      context: .
      dockerfile: ./infrastructure/docker/dev/Dockerfile.server
    container_name: bharatmarket_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      media-service:
        condition: service_started
    env_file:
      - ./infrastructure/.env.dev
      - ./infrastructure/secrets/database.dev.env
      - ./infrastructure/secrets/redis.env
      - ./infrastructure/secrets/jwt.env
      - ./infrastructure/secrets/payment.env
      - ./infrastructure/secrets/firebase.env
      - ./infrastructure/secrets/media.env
    environment:
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-olx_marketplace}?schema=public"
      REDIS_URL: "redis://redis:6379"
      MEDIA_SERVICE_URL: "http://media-service:5005"
    ports:
      - "5000:5000"
    volumes:
      - ./apps/server/src:/app/apps/server/src
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/shared/dist:/app/packages/shared/dist
      - ./packages/database/prisma:/app/packages/database/prisma
      - backend_uploads:/app/uploads
      - ./data/olx-media:/data/olx-media
    networks:
      bharatmarket_net:
        aliases:
          - backend

  # ========================================================
  # BullMQ Background Worker Service (tsx watch Auto-Reload)
  # ========================================================
  workers:
    build:
      context: .
      dockerfile: ./infrastructure/docker/dev/Dockerfile.worker
    container_name: bharatmarket_workers
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./infrastructure/.env.dev
      - ./infrastructure/secrets/database.dev.env
      - ./infrastructure/secrets/redis.env
      - ./infrastructure/secrets/media.env
      - ./infrastructure/secrets/firebase.env
    environment:
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-olx_marketplace}?schema=public"
      REDIS_URL: "redis://redis:6379"
      MEDIA_SERVICE_URL: "http://media-service:5005"
    volumes:
      - ./apps/workers/src:/app/apps/workers/src
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/shared/dist:/app/packages/shared/dist
      - ./packages/database/prisma:/app/packages/database/prisma
      - backend_uploads:/app/uploads
      - ./data/olx-media:/data/olx-media
    networks:
      - bharatmarket_net

  # ========================================================
  # Frontend Web Client (Vite Dev Server + Instant HMR)
  # ========================================================
  client:
    build:
      context: .
      dockerfile: ./infrastructure/docker/dev/Dockerfile.client
    container_name: bharatmarket_client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      - VITE_API_TARGET=http://server:5000
    ports:
      - "5173:5173"
    volumes:
      - ./apps/client/src:/app/apps/client/src
      - ./apps/client/public:/app/apps/client/public
      - ./apps/client/index.html:/app/apps/client/index.html
      - ./apps/client/vite.config.ts:/app/apps/client/vite.config.ts
      - ./apps/client/tailwind.config.js:/app/apps/client/tailwind.config.js
      - ./apps/client/postcss.config.js:/app/apps/client/postcss.config.js
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/shared/dist:/app/packages/shared/dist
    networks:
      bharatmarket_net:
        aliases:
          - client

  # ========================================================
  # Admin Operations Client (Vite Dev Server + Instant HMR)
  # ========================================================
  admin:
    build:
      context: .
      dockerfile: ./infrastructure/docker/dev/Dockerfile.admin
    container_name: bharatmarket_admin
    restart: unless-stopped
    depends_on:
      - server
    environment:
      - VITE_API_TARGET=http://server:5000
    ports:
      - "5174:5174"
    volumes:
      - ./apps/admin/src:/app/apps/admin/src
      - ./apps/admin/public:/app/apps/admin/public
      - ./apps/admin/index.html:/app/apps/admin/index.html
      - ./apps/admin/vite.config.ts:/app/apps/admin/vite.config.ts
      - ./apps/admin/tailwind.config.js:/app/apps/admin/tailwind.config.js
      - ./apps/admin/postcss.config.js:/app/apps/admin/postcss.config.js
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/shared/dist:/app/packages/shared/dist
    networks:
      bharatmarket_net:
        aliases:
          - admin

  # ========================================================
  # Centralized Nginx Gateway with Full WebSocket / HMR Proxy
  # ========================================================
  nginx:
    build:
      context: .
      dockerfile: ./infrastructure/docker/dev/Dockerfile.nginx
    container_name: bharatmarket_nginx
    restart: unless-stopped
    depends_on:
      - server
      - media-service
      - client
      - admin
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/api.dev.conf:/etc/nginx/conf.d/api.conf:ro
      - ./data/olx-media:/data/olx-media:ro
    networks:
      - bharatmarket_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  bharatmarket_net:
    driver: bridge
